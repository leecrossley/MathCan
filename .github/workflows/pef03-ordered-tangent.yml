name: PEF-03 ordered Jacobian Lean and exact integer oracle

on:
  push:
    paths:
      - 'MathCan/OrderedTangent.lean'
      - 'MathCan.lean'
      - 'research/compactification/PEF03_ORDERED_JACOBIAN.md'
      - 'tests/test_ordered_tangent.py'
      - '.github/workflows/pef03-ordered-tangent.yml'
  pull_request:
    paths:
      - 'MathCan/OrderedTangent.lean'
      - 'MathCan.lean'
      - 'research/compactification/PEF03_ORDERED_JACOBIAN.md'
      - 'tests/test_ordered_tangent.py'
      - '.github/workflows/pef03-ordered-tangent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_ordered_tangent.py' -v
  lean-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Inspect PEF-03 transitive axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/OrderedTangent.lean | tee pef03-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' pef03-axioms.txt; then exit 1; fi
