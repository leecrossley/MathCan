name: PEF-02S Lean loop-schedule gap and precision certificates

on:
  push:
    paths:
      - 'MathCan/PrecisionEntropySchedule.lean'
      - 'MathCan.lean'
      - 'research/compactification/PEF02S_FORMAL.md'
      - 'tests/test_precision_entropy_schedule.py'
      - '.github/workflows/pef02s-lean-schedule.yml'
  pull_request:
    paths:
      - 'MathCan/PrecisionEntropySchedule.lean'
      - 'MathCan.lean'
      - 'research/compactification/PEF02S_FORMAL.md'
      - 'tests/test_precision_entropy_schedule.py'
      - '.github/workflows/pef02s-lean-schedule.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_precision_entropy_schedule.py' -v
  lean-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: New PEF-02S theorem axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/PrecisionEntropySchedule.lean | tee pef02s-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' pef02s-axioms.txt; then
            echo "PEF-02S unverified axioms were found."
            exit 1
          fi
