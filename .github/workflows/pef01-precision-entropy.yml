name: PEF-01 finite precision and Lean kernel certificate

on:
  push:
    paths:
      - 'MathCan/PrecisionEntropy.lean'
      - 'MathCan.lean'
      - 'tests/test_precision_entropy.py'
      - '.github/workflows/pef01-precision-entropy.yml'
  pull_request:
    paths:
      - 'MathCan/PrecisionEntropy.lean'
      - 'MathCan.lean'
      - 'tests/test_precision_entropy.py'
      - '.github/workflows/pef01-precision-entropy.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  exact-fibres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_precision_entropy.py' -v
  lean-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: New PEF-01 theorem axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/PrecisionEntropy.lean | tee pef01-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' pef01-axioms.txt; then
            echo "Unverified theorem admitted."
            exit 1
          fi
