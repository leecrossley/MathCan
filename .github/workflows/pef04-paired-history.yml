name: PEF-04 pair-closed causal-history Lean audit
on:
  push:
    paths:
      - 'MathCan/PairedHistory.lean'
      - 'MathCan.lean'
      - 'research/compactification/PEF04_PAIRED_HISTORY.md'
      - 'tests/test_paired_history.py'
      - '.github/workflows/pef04-paired-history.yml'
  pull_request:
    paths:
      - 'MathCan/PairedHistory.lean'
      - 'MathCan.lean'
      - 'research/compactification/PEF04_PAIRED_HISTORY.md'
      - 'tests/test_paired_history.py'
      - '.github/workflows/pef04-paired-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_paired_history.py' -v
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Print transitive axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/PairedHistory.lean | tee pef04-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' pef04-axioms.txt; then exit 1; fi
